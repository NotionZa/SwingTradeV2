# N.20 / N.21 — Universe pool configuration.
# Core watchlist comes from universe.yaml + watchlist.yaml (trade categories).
# Discovery seeds load from discovery_seed.yaml (+ optional flat list below).

discovery_candidates: []

limits:
  # PULLBACK_REQUIRED rows with rr_gap at or below this qualify as active opportunities.
  active_pullback_rr_gap_max: 1.0
  # Max discovery-only names appended after core (hard veto still applies).
  # Set to 0 during apples-to-apples data collection (core watchlist only).
  max_discovery_candidates: 0
  # Ensure trade pool includes at least this many core names when truncating.
  min_core_slots: 41
